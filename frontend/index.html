<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike AI Dashboard | 專業單車數據教練</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>🚴‍♂️ Bike AI Dashboard</h1>
                <p>您的專屬智能單車數據與教練反饋平台</p>
            </div>
            <div id="auth-container">
                <!-- User info and login/logout button will be rendered here -->
                <button id="login-btn" class="btn-primary" style="padding: 0.5rem 1rem;">登入</button>
                <div id="user-info" style="display: none; align-items: center; gap: 1rem;">
                    <span id="user-email"></span>
                    <button id="logout-btn" class="btn-secondary" style="padding: 0.5rem 1rem;">登出</button>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Chart Area with Upload -->
            <section class="chart-section glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="margin-bottom: 0;">📊 騎乘數據趨勢與軌跡</h2>
                    <!-- Upload Section inline -->
                    <div class="upload-area" id="drop-zone" style="padding: 0.5rem 1rem; border-radius: 0.5rem; display: flex; align-items: center; gap: 1rem; margin: 0;">
                        <span class="upload-icon" style="font-size: 1.5rem; margin: 0;">📁</span>
                        <div style="text-align: left;">
                            <h3 style="margin: 0; font-size: 1rem;">上傳 .fit 檔案</h3>
                        </div>
                        <input type="file" id="file-input" accept=".fit" hidden>
                        <button class="btn-primary" onclick="document.getElementById('file-input').click()" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">選擇檔案</button>
                    </div>
                </div>
                <div id="upload-status" class="status-message" style="margin-top: 0; margin-bottom: 1rem;"></div>
                
                <div id="chart-placeholder" class="chart-placeholder">
                    <p>上傳檔案以產生互動圖表</p>
                </div>

                <div id="dashboard-content" style="display: none; width: 100%;">
                    <!-- Metrics Summary -->
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-label">標準化功率 (NP)</span>
                            <span class="metric-value" id="val-np">-- W</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">總距離</span>
                            <span class="metric-value" id="val-dist">-- km</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">停等次數</span>
                            <span class="metric-value" id="val-stops">--</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-label">滑行比例</span>
                            <span class="metric-value" id="val-coast">-- %</span>
                        </div>
                    </div>

                    <!-- Map -->
                    <div id="map-container" class="chart-box" style="height: 400px; margin-bottom: 2rem; border-radius: 1rem; overflow: hidden; background: rgba(0,0,0,0.2); position: relative; z-index: 1;"></div>
                    
                    <!-- Trend Chart -->
                    <div id="trend-chart-container" class="chart-box" style="height: 400px; border-radius: 1rem; background: rgba(0,0,0,0.2);"></div>
                </div>
            </section>

            <!-- AI Feedback Area -->
            <section class="feedback-section glass-panel">
                <h2>🧠 AI 教練反饋</h2>
                <div id="ai-feedback" class="feedback-placeholder">
                    <div class="pulse-ring"></div>
                    <p>等待分析資料...</p>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
